<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>window.__resources={"https://unpkg.com/react@18.3.1/umd/react.production.min.js":"vendor/react.production.min.js","https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js":"vendor/react-dom.production.min.js","https://unpkg.com/@babel/standalone@7.29.0/babel.min.js":"vendor/babel.min.js","https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js":"vendor/gsap.min.js","https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js":"vendor/ScrollTrigger.min.js","https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js":"vendor/lenis.min.js","https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js":"vendor/three.min.js","https://unpkg.com/leaflet@1.9.4/dist/leaflet.js":"vendor/leaflet.js","https://unpkg.com/leaflet@1.9.4/dist/leaflet.css":"vendor/leaflet.css"};</script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>ZweiFach, Selected work</title>
  <link rel="stylesheet" href="_ds/zweifach-design-system-7e7adabc-d98e-4dde-8837-3bfdfefe7304/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/zweifach-design-system-7e7adabc-d98e-4dde-8837-3bfdfefe7304/tokens/colors.css">
  <link rel="stylesheet" href="_ds/zweifach-design-system-7e7adabc-d98e-4dde-8837-3bfdfefe7304/tokens/typography.css">
  <link rel="stylesheet" href="_ds/zweifach-design-system-7e7adabc-d98e-4dde-8837-3bfdfefe7304/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/zweifach-design-system-7e7adabc-d98e-4dde-8837-3bfdfefe7304/tokens/motion.css">
  <link rel="stylesheet" href="_ds/zweifach-design-system-7e7adabc-d98e-4dde-8837-3bfdfefe7304/tokens/base.css">
  <link rel="stylesheet" href="_ds/zweifach-design-system-7e7adabc-d98e-4dde-8837-3bfdfefe7304/styles.css">
  <script src="vendor/lenis.min.js"></script>
  <script>
  (function(){
    try{ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return; }catch(e){}
    if(window.__lenisBooted) return; window.__lenisBooted = true;
    var tries = 0;
    (function boot(){
      if(window.__lenis) return;
      if(!window.Lenis){ if(tries++>150) return; return setTimeout(boot, 40); }
      var l = new Lenis({ duration: 1.05, smoothWheel: true, touchMultiplier: 1.6 });
      window.__lenis = l;
      function raf(t){ l.raf(t); requestAnimationFrame(raf); }
      requestAnimationFrame(raf);
      if(window.ScrollTrigger){ l.on('scroll', window.ScrollTrigger.update); }
    })();
  })();
  </script>
  <script src="data/projects.js"></script>
  <style>
    ::-webkit-scrollbar{width:9px;height:9px;background:transparent}
    ::-webkit-scrollbar-track{background:transparent;border:0;box-shadow:none}
    ::-webkit-scrollbar-track-piece{background:transparent}
    ::-webkit-scrollbar-button{display:none;width:0;height:0}
    ::-webkit-scrollbar-corner{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--accent);border-radius:100px;border:2px solid transparent;background-clip:content-box}
    ::-webkit-scrollbar-thumb:hover{background:var(--accent-hover,#a8946a)}
    html{scrollbar-width:thin;scrollbar-color:var(--accent) transparent}
    em,i,cite{font-style:normal !important}
    body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased}
    ::selection{background:var(--accent);color:var(--bg)}
    .wrap{max-width:1400px;margin:0 auto;padding-inline:var(--pad-x)}
    .corner{font-size:.72rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--taupe)}
    /* header + full-screen menu now come from the shared <SiteHeader> component */
    /* page */
    .ow-hero{padding:clamp(130px,20vh,220px) 0 clamp(30px,6vh,60px)}
    .ow-eyebrow{font-size:.72rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin:0 0 1.3em}
    .ow-title{margin:0;font-weight:500;font-size:clamp(2.6rem,7vw,6rem);line-height:1;letter-spacing:-.03em}
    .ow-lead{margin:26px 0 0;max-width:52ch;font-size:clamp(1.05rem,1.4vw,1.35rem);line-height:1.6;color:var(--muted)}
    .ow-filters{display:flex;gap:10px;flex-wrap:wrap;margin:clamp(34px,6vh,60px) 0 0;padding-bottom:24px;border-bottom:1px solid var(--line)}
    .ow-pill{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;min-height:40px;font-family:var(--font);cursor:pointer;background:transparent;border:1px solid var(--line);color:var(--muted);padding:0 18px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;transition:all .35s}
    .ow-pill:hover{border-color:var(--fg);color:var(--fg)}
    .ow-pill.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
    .ow-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(20px,3vw,44px);padding:clamp(34px,6vh,60px) 0 clamp(80px,14vh,150px)}
    @media (max-width:820px){.ow-grid{grid-template-columns:1fr}}
    /* a lone card in the final row (odd count) spans the full width as a wide banner */
    @media (min-width:821px){
      .ow-grid > .ow-card:last-child:nth-child(odd){grid-column:1 / -1}
      .ow-grid > .ow-card:last-child:nth-child(odd) .ow-card__media{aspect-ratio:2.5 / 1}
    }
    .ow-card{position:relative;display:block;text-decoration:none;color:var(--fg)}
    .ow-card__media{position:relative;aspect-ratio:16/11;overflow:hidden;border-radius:6px;background:var(--panel)}
    .ow-card__media img{width:100%;height:100%;object-fit:cover;transition:transform 1s cubic-bezier(.16,1,.3,1)}
    .ow-card:hover .ow-card__media img{transform:scale(1.05)}
    .ow-card__scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(14,15,13,.5),transparent 55%)}
    .ow-card__status{position:absolute;left:16px;top:16px;background:rgba(244,240,231,.92);color:var(--graphite);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;padding:6px 12px;border-radius:100px}
    .ow-card__idx{position:absolute;right:16px;top:16px;color:rgba(244,240,231,.85);font-size:.7rem;letter-spacing:.14em}
    .ow-card__foot{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-top:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
    .ow-card__title{font-weight:500;font-size:clamp(1.5rem,2.4vw,2.2rem);letter-spacing:-.02em;margin:0}
    .ow-card__meta{font-size:13px;color:var(--muted);text-align:right}
  </style>
</helmet>

<div>
  <dc-import name="SiteHeader" current="Work" hint-size="100%,72px" style="display:block"></dc-import>



  <section class="ow-hero" data-screen-label="Work hero">
    <div class="wrap">
      <p class="ow-eyebrow">Selected work · (05)</p>
      <h1 class="ow-title">The proof,<br>in one place.</h1>
      <p class="ow-lead">Every development we take on runs the same chain, drawn to be financeable, sold before it's built. Filter by the craft that leads.</p>
      <div class="ow-filters" id="filters">
        <button class="ow-pill on" data-f="all">All</button>
        <button class="ow-pill" data-f="both">Full chain</button>
        <button class="ow-pill" data-f="blueprint">Architecture</button>
      </div>
    </div>
  </section>

  <div class="wrap">
    <div class="ow-grid" id="grid">
      <sc-for list="{{ cards }}" as="c" hint-placeholder-count="5">
        <a class="ow-card" href="{{ c.href }}">
          <div class="ow-card__media">
            <img src="{{ c.hero }}" alt="{{ c.name }}">
            <div class="ow-card__scrim"></div>
            <span class="ow-card__status">{{ c.status }}</span>
            <span class="ow-card__idx">{{ c.idx }}</span>
          </div>
          <div class="ow-card__foot">
            <h3 class="ow-card__title">{{ c.name }}</h3>
            <span class="ow-card__meta">{{ c.program }}<br>{{ c.place }}</span>
          </div>
        </a>
      </sc-for>
    </div>
  </div>

  <dc-import name="SiteFooter" hint-size="100%,auto" style="display:block;width:100%"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  state = { filter: 'all' };
  componentDidMount() {
    // menu / header interactions are owned by the shared <SiteHeader> component
    // Lenis boots in <helmet> before the footer (a late-mounting dc-import) exists,
    // so its scroll limit is stale and clamps before the footer — recompute it.
    const bump = () => { try { if (window.__lenis) window.__lenis.resize(); } catch (e) {} };
    [120, 400, 900, 1600].forEach((t) => setTimeout(bump, t));
    window.addEventListener('load', bump);
    if (window.ResizeObserver) { try { new ResizeObserver(bump).observe(document.body); } catch (e) {} }
    document.querySelectorAll('img').forEach((im) => { if (!im.complete) im.addEventListener('load', bump, { once: true }); });
    const filters = document.getElementById('filters');
    if (filters) filters.addEventListener('click', (e) => {
      const b = e.target.closest('.ow-pill'); if (!b) return;
      filters.querySelectorAll('.ow-pill').forEach((x) => x.classList.toggle('on', x === b));
      this.setState({ filter: b.dataset.f });
    });
  }
  renderVals() {
    const db = window.ZF_PROJECTS || { order: [], items: {} };
    const f = this.state.filter;
    const list = db.order.map((slug, i) => ({ ...db.items[slug], i })).filter((p) => f === 'all' ? true : (f === 'both' ? p.strand === 'both' : p.strand === f));
    return {
      cards: list.map((p) => ({
        href: 'case-study.html?p=' + p.slug,
        hero: p.hero, name: p.name, status: p.status, program: p.program, place: p.place,
        idx: '0' + (db.order.indexOf(p.slug) + 1)
      }))
    };
  }
}
</script>
</body>
</html>
