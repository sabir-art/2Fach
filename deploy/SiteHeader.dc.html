<script type="text/x-dc" data-dc-script data-props="{&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;None&quot;,&quot;Home&quot;,&quot;Work&quot;,&quot;Architecture&quot;,&quot;Commercialisation&quot;,&quot;Studio&quot;,&quot;Contact&quot;],&quot;default&quot;:&quot;None&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;topTint&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    const ov = document.getElementById('menuOverlay');
    const btn = document.getElementById('menuBtn');
    const hd = document.getElementById('siteHead');

    const setMenu = (open) => {
      if (!ov) return;
      ov.classList.toggle('open', open);
      ov.setAttribute('aria-hidden', open ? 'false' : 'true');
      if (btn) { btn.classList.toggle('is-x', open); btn.setAttribute('aria-expanded', open ? 'true' : 'false'); btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu'); }
      if (hd) { hd.classList.toggle('menu-open', open); if (open) hd.classList.remove('is-hidden'); }
    };
    if (btn) btn.addEventListener('click', () => setMenu(!ov.classList.contains('open')));
    // clicking a nav link closes the overlay (same-page anchors won't reload)
    ov && ov.querySelectorAll('.menu-nav a').forEach((a) => a.addEventListener('click', () => setMenu(false)));
    this._esc = (e) => { if (e.key === 'Escape') setMenu(false); };
    document.addEventListener('keydown', this._esc);

    // active nav link
    const cur = this.props.current ?? 'None';
    if (cur && cur !== 'None') {
      const a = document.querySelector('.menu-nav a[data-key="' + cur.toLowerCase() + '"]');
      if (a) a.setAttribute('aria-current', 'page');
    }

    // light text at the top for pages over a dark hero
    if (hd && (this.props.topTint ?? 'dark') === 'light') hd.classList.add('top-light');

    // centred brand: measure full + mark widths, clone the "2F" mark into the sheen layer
    const crop = document.getElementById('zbrandCrop');
    const sheen = document.getElementById('zbrandSheen');
    const mark = crop && crop.querySelector('.zmark');
    if (crop && sheen && mark) {
      if (!sheen.childElementCount) sheen.innerHTML = mark.innerHTML;
      this._measure = () => {
        const svg = crop.querySelector('.brand-logo');
        const h = (svg && svg.getBoundingClientRect().height) || 42;
        this._zwFull = +(h * (477.92 / 172.02) + 1).toFixed(2);
        this._zwMark = +(h * (178 / 172.02)).toFixed(2);
        crop.style.width = (crop.classList.contains('lock') ? this._zwMark : this._zwFull) + 'px';
      };
      this._measure();
      requestAnimationFrame(this._measure);
      window.addEventListener('resize', this._measure, { passive: true });
    }

    // scroll: collapse logo (lock) + glossy bar + hide-on-down / show-on-up
    this._lastY = window.scrollY || 0;
    this._scroll = () => {
      const y = window.scrollY || 0;
      if (crop && this._zwFull != null) {
        const lk = y > 24;
        crop.classList.toggle('lock', lk);
        if (hd) hd.classList.toggle('is-locked', lk);
        crop.style.width = (lk ? this._zwMark : this._zwFull) + 'px';
      }
      if (hd) hd.classList.toggle('is-glossy', y > 40);
      // direction-based show / hide (never while the menu is open)
      if (hd && !(ov && ov.classList.contains('open'))) {
        const dy = y - this._lastY;
        if (y < 70) hd.classList.remove('is-hidden');
        else if (dy > 5) hd.classList.add('is-hidden');
        else if (dy < -5) hd.classList.remove('is-hidden');
      }
      if (Math.abs(y - this._lastY) > 0.5) this._lastY = y;
    };
    this._scroll();
    window.addEventListener('scroll', this._scroll, { passive: true });

    // theme toggle (site-wide, persisted)
    const root = document.documentElement;
    let dark = false;
    try { dark = localStorage.getItem('zf-theme') === 'dark'; } catch (e) {}
    root.classList.toggle('theme-dark', dark);
    const tbtn = document.getElementById('zthemeBtn');
    if (tbtn) {
      this._theme = () => {
        const next = !root.classList.contains('theme-dark');
        root.classList.toggle('theme-dark', next);
        try { localStorage.setItem('zf-theme', next ? 'dark' : 'light'); } catch (e) {}
      };
      tbtn.addEventListener('click', this._theme);
    }
  }

  componentWillUnmount() {
    if (this._esc) document.removeEventListener('keydown', this._esc);
    if (this._scroll) window.removeEventListener('scroll', this._scroll);
    if (this._measure) window.removeEventListener('resize', this._measure);
    const tbtn = document.getElementById('zthemeBtn');
    if (tbtn && this._theme) tbtn.removeEventListener('click', this._theme);
  }

  renderVals() { return {}; }
}
</script>
