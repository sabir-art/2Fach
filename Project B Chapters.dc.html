<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>ZweiFach, Project</title>
  <link rel="stylesheet" href="_ds/zweifach-design-system-7e7adabc-d98e-4dde-8837-3bfdfefe7304/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/zweifach-design-system-7e7adabc-d98e-4dde-8837-3bfdfefe7304/tokens/colors.css">
  <link rel="stylesheet" href="_ds/zweifach-design-system-7e7adabc-d98e-4dde-8837-3bfdfefe7304/tokens/typography.css">
  <link rel="stylesheet" href="_ds/zweifach-design-system-7e7adabc-d98e-4dde-8837-3bfdfefe7304/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/zweifach-design-system-7e7adabc-d98e-4dde-8837-3bfdfefe7304/tokens/motion.css">
  <link rel="stylesheet" href="_ds/zweifach-design-system-7e7adabc-d98e-4dde-8837-3bfdfefe7304/tokens/base.css">
  <link rel="stylesheet" href="_ds/zweifach-design-system-7e7adabc-d98e-4dde-8837-3bfdfefe7304/styles.css">
  <script src="_ds/zweifach-design-system-7e7adabc-d98e-4dde-8837-3bfdfefe7304/_ds_bundle.js"></script>
  <script src="data/projects.js"></script>
  <style>
    :root{--bg:#FCFBF7;--panel:#F5F1E8;--fg:#16181A;--muted:rgba(22,24,26,.66);--line:rgba(22,24,26,.16);--taupe:#A59C8C;--accent:#A59C8C;--accent-hover:#B8B0A2}
    ::-webkit-scrollbar{width:9px;height:9px;background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--accent);border-radius:100px;border:2px solid transparent;background-clip:content-box}
    html{scrollbar-width:thin;scrollbar-color:var(--accent) transparent}
    em,i,cite{font-style:normal !important}
    body{margin:0;background:#FCFBF7;color:#16181A;font-family:var(--font);-webkit-font-smoothing:antialiased}
    a{color:#16181A}a:hover{color:#A59C8C}
    ::selection{background:#A59C8C;color:#FCFBF7}
  </style>
</helmet>

<div style="background:#FCFBF7">
  <dc-import name="SiteHeader" current="Work" top-tint="light" hint-size="100%,72px" style="display:block"></dc-import>

  <section data-screen-label="Hero" style="position:relative;height:82vh;min-height:500px;overflow:hidden;background:#16181A">
    <img src="{{ hero }}" alt="{{ name }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
    <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(22,24,26,.7) 0%,rgba(22,24,26,.1) 48%,rgba(22,24,26,.32) 100%)"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;padding:0 clamp(20px,6vw,90px) clamp(32px,5.5vh,60px);display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px">
      <div style="display:flex;flex-direction:column;gap:12px">
        <p style="margin:0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.78)">{{ meta }}</p>
        <h1 style="margin:0;font-weight:500;font-size:clamp(42px,6.2vw,102px);line-height:1;letter-spacing:-.03em;color:#fff;text-shadow:0 2px 30px rgba(0,0,0,.3)">{{ name }}</h1>
      </div>
      <p style="margin:0;max-width:34ch;font-size:15px;line-height:1.55;color:rgba(255,255,255,.84);text-shadow:0 1px 12px rgba(0,0,0,.4)">{{ tagline }}</p>
    </div>
  </section>

  <section data-screen-label="Chapters" style="padding:clamp(50px,9vh,110px) clamp(20px,6vw,90px) clamp(30px,5vh,60px)">
    <div style="max-width:1100px;margin:0 auto">
      <p style="margin:0 0 clamp(26px,4.5vh,48px);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#A59C8C">The project, chapter by chapter</p>
      <div style="display:flex;flex-direction:column">
        <sc-for list="{{ chapters }}" as="ch" hint-placeholder-count="4">
          <div style="border-top:1px solid rgba(22,24,26,.16);{{ ch.lastStyle }}">
            <button onClick="{{ ch.toggle }}" aria-expanded="{{ ch.expanded }}" style="width:100%;cursor:pointer;font-family:inherit;background:none;border:0;padding:clamp(20px,3.4vh,34px) 0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:clamp(16px,3vw,34px);align-items:center;text-align:left;color:{{ ch.headColor }};transition:color .35s ease" style-hover="color:#A59C8C">
              <span style="font-size:11px;letter-spacing:.16em;color:#A59C8C;font-variant-numeric:tabular-nums">{{ ch.index }}</span>
              <span style="font-weight:500;font-size:clamp(21px,2.4vw,34px);letter-spacing:-.02em">{{ ch.title }}</span>
              <span style="display:flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid rgba(22,24,26,.2);border-radius:100px;color:#A59C8C;transform:{{ ch.iconTf }};transition:transform .5s cubic-bezier(.16,1,.3,1)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
              </span>
            </button>
            <div style="overflow:hidden;max-height:{{ ch.maxH }};opacity:{{ ch.op }};transition:max-height .7s cubic-bezier(.16,1,.3,1),opacity .5s ease">
              <div style="display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(16px,3vw,34px);padding:0 0 clamp(26px,4.5vh,48px)">
                <span style="width:11px"></span>
                <div style="display:flex;flex-direction:column;gap:clamp(18px,3vh,30px)">
                  <p style="margin:0;max-width:56ch;font-size:clamp(16px,1.35vw,19px);line-height:1.62;color:rgba(22,24,26,.78);text-wrap:pretty">{{ ch.body }}</p>
                  <span style="display:block;overflow:hidden;border-radius:6px;background:#F5F1E8;aspect-ratio:16/9;max-width:720px">
                    <img src="{{ ch.img }}" alt="{{ ch.title }}" loading="lazy" style="width:100%;height:100%;object-fit:{{ ch.fit }};display:block;background:#fff">
                  </span>
                  <p style="margin:0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(22,24,26,.6)">{{ ch.caption }}</p>
                </div>
              </div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </section>

  <section data-screen-label="Figures" style="padding:clamp(40px,7vh,90px) clamp(20px,6vw,90px);background:#F5F1E8">
    <div style="max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:clamp(18px,3vw,40px)">
      <sc-for list="{{ figures }}" as="f" hint-placeholder-count="3">
        <div style="display:flex;flex-direction:column;gap:8px">
          <span style="font-weight:300;font-size:clamp(28px,2.8vw,44px);line-height:1;letter-spacing:-.02em">{{ f.value }}</span>
          <span style="font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(22,24,26,.66)">{{ f.label }}</span>
        </div>
      </sc-for>
    </div>
  </section>

  <a data-screen-label="Next" href="{{ nextHref }}" style="position:relative;display:flex;align-items:center;min-height:44vh;overflow:hidden;background:#16181A;color:#fff;text-decoration:none">
    <img src="{{ nextHero }}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.32">
    <div style="position:relative;width:100%;max-width:1100px;margin:0 auto;padding:clamp(38px,7vh,76px) clamp(20px,6vw,90px);box-sizing:border-box">
      <p style="margin:0 0 18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.62)">Next project</p>
      <p style="margin:0;display:flex;align-items:center;gap:.4em;font-weight:500;font-size:clamp(32px,4.8vw,76px);line-height:1;letter-spacing:-.03em">{{ nextName }}
        <svg width="0.6em" height="0.6em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </p>
    </div>
  </a>

  <dc-import name="SiteFooter" hint-size="100%,auto" style="display:block;width:100%"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;project&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;bellevue&quot;,&quot;rothruthi&quot;,&quot;seeblick&quot;,&quot;niederrohrdorf&quot;,&quot;buero&quot;],&quot;default&quot;:&quot;bellevue&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;}}">
class Component extends DCLogic {
  state = { open: 0 };

  getProject() {
    const db = window.ZF_PROJECTS || { order: [], items: {} };
    const q = new URLSearchParams(location.search);
    const slug = q.get('p') || (this.props.project ?? 'bellevue');
    return db.items[slug] || db.items[db.order[0]] || null;
  }

  componentDidMount() {
    const p = this.getProject();
    if (p) document.title = 'ZweiFach, ' + p.name;
  }

  renderVals() {
    const p = this.getProject();
    if (!p) return { name: 'Loading…', chapters: [], figures: [] };
    const db = window.ZF_PROJECTS;
    const next = db.items[p.next] || p;
    const imgs = p.images || [];
    const plans = p.plans || [];
    const salesPlan = plans.find((pl) => pl.set !== 'Technical set') || plans[0] || {};
    const techPlan = plans.find((pl) => pl.set === 'Technical set') || plans[plans.length - 1] || {};
    const defs = [
      { title: 'The site and the brief', body: p.context, img: (imgs[0] || {}).src, caption: (imgs[0] || {}).cap || '', fit: 'cover' },
      { title: 'The design', body: p.design, img: salesPlan.src, caption: salesPlan.cap || salesPlan.label || '', fit: 'contain' },
      { title: 'Permit and technical set', body: 'The same design produced the sheets the commune signs off and the builder works from.', img: techPlan.src, caption: techPlan.cap || techPlan.label || '', fit: 'contain' },
      { title: 'Sold on the drawings', body: p.commercial, img: (imgs[2] || imgs[1] || {}).src, caption: (imgs[2] || imgs[1] || {}).cap || '', fit: 'cover' }
    ].filter((d) => d.body);
    const open = this.state.open;
    return {
      name: p.name,
      meta: [p.status, p.place, p.year].filter(Boolean).join(' · '),
      hero: p.hero,
      tagline: p.tagline,
      figures: p.figures || [],
      chapters: defs.map((d, i) => ({
        index: '(0' + (i + 1) + ')',
        title: d.title, body: d.body, img: d.img, caption: d.caption, fit: d.fit,
        expanded: i === open ? 'true' : 'false',
        headColor: i === open ? '#16181A' : 'rgba(22,24,26,.72)',
        iconTf: i === open ? 'rotate(180deg)' : 'none',
        maxH: i === open ? '1400px' : '0px',
        op: i === open ? '1' : '0',
        lastStyle: i === defs.length - 1 ? 'border-bottom:1px solid rgba(22,24,26,.16)' : '',
        toggle: () => this.setState({ open: this.state.open === i ? -1 : i })
      })),
      nextName: next.name, nextHero: next.hero, nextHref: 'Project B Chapters.dc.html?p=' + next.slug
    };
  }
}
</script>
</body>
</html>
