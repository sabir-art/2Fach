<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>ZweiFach, Project</title>
  <link rel="stylesheet" href="_ds/zweifach-design-system-7e7adabc-d98e-4dde-8837-3bfdfefe7304/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/zweifach-design-system-7e7adabc-d98e-4dde-8837-3bfdfefe7304/tokens/colors.css">
  <link rel="stylesheet" href="_ds/zweifach-design-system-7e7adabc-d98e-4dde-8837-3bfdfefe7304/tokens/typography.css">
  <link rel="stylesheet" href="_ds/zweifach-design-system-7e7adabc-d98e-4dde-8837-3bfdfefe7304/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/zweifach-design-system-7e7adabc-d98e-4dde-8837-3bfdfefe7304/tokens/motion.css">
  <link rel="stylesheet" href="_ds/zweifach-design-system-7e7adabc-d98e-4dde-8837-3bfdfefe7304/tokens/base.css">
  <link rel="stylesheet" href="_ds/zweifach-design-system-7e7adabc-d98e-4dde-8837-3bfdfefe7304/styles.css">
  <script src="_ds/zweifach-design-system-7e7adabc-d98e-4dde-8837-3bfdfefe7304/_ds_bundle.js"></script>
  <script src="data/projects.js"></script>
  <style>
    :root{
      --bg:#FCFBF7;--panel:#F5F1E8;
      --fg:#16181A;--muted:rgba(22,24,26,.66);--line:rgba(22,24,26,.16);
      --taupe:#A59C8C;--accent:#A59C8C;--accent-hover:#B8B0A2;
    }
    ::-webkit-scrollbar{width:9px;height:9px;background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--accent);border-radius:100px;border:2px solid transparent;background-clip:content-box}
    html{scrollbar-width:thin;scrollbar-color:var(--accent) transparent}
    em,i,cite{font-style:normal !important}
    body{margin:0;background:#FCFBF7;color:#16181A;font-family:var(--font);-webkit-font-smoothing:antialiased}
    a{color:#16181A}a:hover{color:#A59C8C}
    ::selection{background:#A59C8C;color:#FCFBF7}
  </style>
</helmet>

<div style="background:#FCFBF7">
  <dc-import name="SiteHeader" current="Work" top-tint="light" hint-size="100%,72px" style="display:block"></dc-import>

  <section data-screen-label="Hero" style="position:relative;height:88vh;min-height:520px;overflow:hidden;background:#16181A">
    <img src="{{ hero }}" alt="{{ name }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
    <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(22,24,26,.72) 0%,rgba(22,24,26,.12) 46%,rgba(22,24,26,.34) 100%)"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;padding:0 clamp(20px,6vw,90px) clamp(34px,6vh,64px);display:flex;flex-direction:column;gap:14px">
      <p style="margin:0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.78)">{{ meta }}</p>
      <h1 style="margin:0;font-weight:500;font-size:clamp(44px,6.6vw,110px);line-height:1;letter-spacing:-.03em;color:#fff;text-shadow:0 2px 30px rgba(0,0,0,.3)">{{ name }}</h1>
    </div>
  </section>

  <section data-screen-label="Lead" style="padding:clamp(60px,11vh,130px) clamp(20px,6vw,90px) clamp(40px,7vh,80px)">
    <div style="max-width:1200px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(34px,6vh,70px)">
      <p style="margin:0;max-width:24ch;font-weight:500;font-size:clamp(26px,3.4vw,52px);line-height:1.16;letter-spacing:-.02em;text-wrap:pretty">{{ tagline }}</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:clamp(18px,3vw,40px);padding-top:clamp(22px,4vh,40px);border-top:1px solid rgba(22,24,26,.16)">
        <sc-for list="{{ figures }}" as="f" hint-placeholder-count="3">
          <div style="display:flex;flex-direction:column;gap:8px">
            <span style="font-weight:300;font-size:clamp(30px,3vw,46px);line-height:1;letter-spacing:-.02em">{{ f.value }}</span>
            <span style="font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(22,24,26,.66)">{{ f.label }}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </section>

  <section data-screen-label="Images" style="padding:0 clamp(20px,6vw,90px) clamp(50px,9vh,110px)">
    <div style="max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(40px,7vh,96px)">
      <sc-for list="{{ shots }}" as="im" hint-placeholder-count="4">
        <figure style="margin:0;display:flex;flex-direction:column;gap:14px;{{ im.wrap }}">
          <span style="display:block;overflow:hidden;border-radius:6px;background:#F5F1E8;aspect-ratio:{{ im.ratio }}">
            <img src="{{ im.src }}" alt="{{ im.cap }}" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block">
          </span>
          <figcaption style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(22,24,26,.6)">{{ im.cap }}</figcaption>
        </figure>
      </sc-for>
    </div>
  </section>

  <section data-screen-label="One paragraph" style="padding:clamp(50px,9vh,110px) clamp(20px,6vw,90px);background:#F5F1E8">
    <div style="max-width:1200px;margin:0 auto;display:grid;grid-template-columns:minmax(0,.4fr) minmax(0,1fr);gap:clamp(24px,5vw,70px);align-items:start">
      <p style="margin:0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#A59C8C">In short</p>
      <p style="margin:0;font-size:clamp(19px,1.8vw,27px);line-height:1.52;text-wrap:pretty;max-width:46ch">{{ shortLine }}</p>
    </div>
  </section>

  <section data-screen-label="Drawings" style="padding:clamp(50px,9vh,110px) clamp(20px,6vw,90px)">
    <div style="max-width:1200px;margin:0 auto">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding-bottom:22px;border-bottom:1px solid rgba(22,24,26,.16)">
        <p style="margin:0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#A59C8C">The drawings</p>
        <p style="margin:0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(22,24,26,.6)">{{ planCount }}</p>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:clamp(18px,3vw,40px);margin-top:clamp(26px,5vh,54px)">
        <sc-for list="{{ planShots }}" as="pl" hint-placeholder-count="3">
          <figure style="margin:0;display:flex;flex-direction:column;gap:12px">
            <span style="display:flex;align-items:center;justify-content:center;padding:18px;border:1px solid rgba(22,24,26,.16);border-radius:6px;background:#fff;aspect-ratio:4/3;box-sizing:border-box">
              <img src="{{ pl.src }}" alt="{{ pl.label }}" loading="lazy" style="max-width:100%;max-height:100%;object-fit:contain">
            </span>
            <figcaption style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(22,24,26,.6)">{{ pl.label }}</figcaption>
          </figure>
        </sc-for>
      </div>
    </div>
  </section>

  <a data-screen-label="Next" href="{{ nextHref }}" style="position:relative;display:flex;align-items:center;min-height:46vh;overflow:hidden;background:#16181A;color:#fff;text-decoration:none">
    <img src="{{ nextHero }}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.32">
    <div style="position:relative;width:100%;max-width:1200px;margin:0 auto;padding:clamp(40px,7vh,80px) clamp(20px,6vw,90px);box-sizing:border-box">
      <p style="margin:0 0 18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.62)">Next project</p>
      <p style="margin:0;display:flex;align-items:center;gap:.4em;font-weight:500;font-size:clamp(34px,5vw,80px);line-height:1;letter-spacing:-.03em">{{ nextName }}
        <svg width="0.6em" height="0.6em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </p>
    </div>
  </a>

  <dc-import name="SiteFooter" hint-size="100%,auto" style="display:block;width:100%"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;project&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;bellevue&quot;,&quot;rothruthi&quot;,&quot;seeblick&quot;,&quot;niederrohrdorf&quot;,&quot;buero&quot;],&quot;default&quot;:&quot;bellevue&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;}}">
class Component extends DCLogic {
  getProject() {
    const db = window.ZF_PROJECTS || { order: [], items: {} };
    const q = new URLSearchParams(location.search);
    const slug = q.get('p') || (this.props.project ?? 'bellevue');
    return db.items[slug] || db.items[db.order[0]] || null;
  }

  componentDidMount() {
    const p = this.getProject();
    if (p) document.title = 'ZweiFach, ' + p.name;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const io = new IntersectionObserver((es) => {
      es.forEach((e) => {
        if (!e.isIntersecting) return;
        e.target.style.transition = 'opacity 1s cubic-bezier(.16,1,.3,1), transform 1.1s cubic-bezier(.16,1,.3,1)';
        e.target.style.opacity = '1'; e.target.style.transform = 'none';
        io.unobserve(e.target);
      });
    }, { threshold: .12 });
    this._io = io;
    setTimeout(() => {
      document.querySelectorAll('figure, section p, section > div > div').forEach((el) => {
        if (el.closest('a')) return;
        el.style.opacity = '0'; el.style.transform = 'translateY(30px)';
        io.observe(el);
      });
    }, 60);
  }

  componentWillUnmount() { if (this._io) this._io.disconnect(); }

  renderVals() {
    const p = this.getProject();
    if (!p) return { name: 'Loading…', figures: [], shots: [], planShots: [] };
    const db = window.ZF_PROJECTS;
    const next = db.items[p.next] || p;
    const imgs = (p.images || []).slice(0, 4);
    const ratios = ['16/10', '4/3', '4/3', '16/10'];
    return {
      name: p.name,
      meta: [p.status, p.place, p.year].filter(Boolean).join(' · '),
      hero: p.hero,
      tagline: p.tagline,
      shortLine: p.context,
      figures: p.figures || [],
      shots: imgs.map((im, i) => ({
        src: im.src, cap: im.cap, ratio: ratios[i % ratios.length],
        wrap: i % 2 === 1 ? 'max-width:74%;align-self:flex-end' : ''
      })),
      planCount: ((p.plans || []).length) + ' sheets, sales and technical',
      planShots: (p.plans || []).slice(0, 3).map((pl) => ({ src: pl.src, label: pl.label })),
      nextName: next.name, nextHero: next.hero, nextHref: 'Project A Quiet.dc.html?p=' + next.slug
    };
  }
}
</script>
</body>
</html>
