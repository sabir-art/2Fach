<helmet>
  <link rel="stylesheet" href="_ds/zweifach-design-system-7e7adabc-d98e-4dde-8837-3bfdfefe7304/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/zweifach-design-system-7e7adabc-d98e-4dde-8837-3bfdfefe7304/tokens/colors.css">
  <link rel="stylesheet" href="_ds/zweifach-design-system-7e7adabc-d98e-4dde-8837-3bfdfefe7304/tokens/typography.css">
  <link rel="stylesheet" href="_ds/zweifach-design-system-7e7adabc-d98e-4dde-8837-3bfdfefe7304/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/zweifach-design-system-7e7adabc-d98e-4dde-8837-3bfdfefe7304/tokens/motion.css">
  <link rel="stylesheet" href="_ds/zweifach-design-system-7e7adabc-d98e-4dde-8837-3bfdfefe7304/tokens/base.css">
  <style>
    /* white canvas, slate-blue ink */
    :root{
      --bg:#FCFBF7;--panel:#F5F1E8;
      --fg:#16181A;--muted:rgba(22,24,26,.66);--line:rgba(22,24,26,.16);
      --on-media:#ffffff;--on-media-muted:rgba(255,255,255,.82);
      --media-dark:#16181A;--ink:#16181A;--graphite:#211F1B;--bg-dark:#16181A;--bg-forest:#16181A;
      --taupe:#A59C8C;--accent:#A59C8C;--accent-hover:#B8B0A2;--logo:#A59C8C;--accent-ink:#A59C8C;--brand-ink:#A59C8C;
      --fill-hover:rgba(22,24,26,.11);--fill-rest:rgba(22,24,26,.05);--disabled-fg:rgba(22,24,26,.32);
      --glass-fill:rgba(255,255,255,.14);--glass-fill-strong:rgba(255,255,255,.22);
    }
    .zhead{--hc:var(--fg);position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px var(--pad-x);min-height:72px;box-sizing:border-box;background:transparent;border-bottom:1px solid transparent;transition:transform .5s var(--ease-out-expo),background .5s var(--ease-out-expo),border-color .5s,backdrop-filter .5s;will-change:transform}
    .zhead a{color:var(--hc);text-decoration:none}
    .zhead.is-glossy{background:rgba(250,248,242,.92);backdrop-filter:blur(14px) saturate(1.1);-webkit-backdrop-filter:blur(14px) saturate(1.1);border-bottom:1px solid transparent;box-shadow:0 6px 22px rgba(22,24,26,.07)}
    .zhead.is-hidden{transform:translateY(-125%)}
    .zh-side{display:flex;align-items:center;gap:clamp(13px,1.9vw,26px);flex:1 1 0;min-width:0}
    .zh-right{justify-content:flex-end}
    .zh-link{font-size:11px;letter-spacing:.2em;text-transform:uppercase;transition:opacity .35s;white-space:nowrap}
    .zh-link:hover{opacity:.62}
    .zh-contact{display:inline-flex;align-items:baseline;gap:9px}
    .zh-mail{opacity:.58;text-transform:none;letter-spacing:.02em;font-size:11.5px}
    .zh-brand{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center}
    .zh-brand img{display:block;height:34px;width:auto}
    @media (max-width:900px){.zh-mail{display:none}}
    .zhead .zh-brand,.zhead .zh-side{transition:opacity .35s var(--ease-out-expo)}
    .zhead.menu-open{z-index:400;pointer-events:none;--hc:var(--on-media);background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none;border-bottom-color:transparent}
    .zhead.menu-open .zh-brand,.zhead.menu-open .zh-navlink,.zhead.menu-open .zh-contact{opacity:0;pointer-events:none}
    .zhead.menu-open .zmenu{pointer-events:auto;color:var(--on-media)}
    .zmenu{display:flex;align-items:center;justify-content:center;box-sizing:border-box;min-height:40px;gap:11px;background:none;border:0;cursor:pointer;font-family:var(--font);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--hc);padding:0 2px}
    .zmenu__lbl .l-close{display:none}
    .zmenu.is-x .l-open{display:none}
    .zmenu.is-x .l-close{display:inline}
    .zmenu__ic{position:relative;display:block;width:22px;height:14px;flex:none}
    .zmenu__ic i{position:absolute;left:0;right:0;height:1.6px;background:currentColor;border-radius:2px;transform-origin:50% 50%;transition:transform .45s var(--ease-out-expo),opacity .28s var(--ease-out-expo)}
    .zmenu__ic i:nth-child(1){top:0}
    .zmenu__ic i:nth-child(2){top:50%;transform:translateY(-50%)}
    .zmenu__ic i:nth-child(3){bottom:0}
    .zmenu:hover .zmenu__ic i:nth-child(2){opacity:.55}
    .zmenu.is-x .zmenu__ic i:nth-child(1){transform:translateY(6.2px) rotate(45deg)}
    .zmenu.is-x .zmenu__ic i:nth-child(2){opacity:0}
    .zmenu.is-x .zmenu__ic i:nth-child(3){transform:translateY(-6.2px) rotate(-45deg)}
    .menu-ov{position:fixed;inset:0;z-index:300;background:var(--ink);color:var(--on-media);display:flex;flex-direction:column;justify-content:center;padding:0 var(--pad-x);clip-path:inset(0 0 100% 0);transition:clip-path .8s cubic-bezier(.16,1,.3,1);pointer-events:none}
    .menu-ov.open{clip-path:inset(0 0 0 0);pointer-events:auto}
    .menu-nav{display:flex;flex-direction:column;max-width:1200px;margin:0 auto;width:100%}
    .menu-nav a{display:flex;align-items:baseline;gap:22px;text-decoration:none;color:var(--on-media);font-weight:300;font-size:clamp(2.2rem,7vw,5.4rem);line-height:1.06;letter-spacing:-.02em;opacity:.5;transition:opacity .4s,transform .5s var(--ease-out-expo)}
    .menu-nav a:hover{opacity:1;transform:translateX(18px);color:var(--clay-soft)}
    .menu-nav a em{font-size:.8rem;letter-spacing:.14em;color:var(--accent);font-style:normal}
    .menu-foot{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;max-width:1200px;margin:clamp(30px,6vh,60px) auto 0;width:100%;padding-top:22px;border-top:1px solid rgba(255,255,255,.16);font-size:12px;color:rgba(255,255,255,.6)}
    .menu-foot a{color:rgba(255,255,255,.6);text-decoration:none}
  </style>
</helmet>

<header class="zhead" id="zhead" data-screen-label="Header">
  <div class="zh-side zh-left">
    <a class="zh-link zh-navlink" href="Team.dc.html">Team</a>
    <a class="zh-link zh-mail zh-navlink" href="mailto:hello@zweifach.ch">hello@zweifach.ch</a>
  </div>
  <a class="zh-brand" href="Home.dc.html" aria-label="2Fach, home"><img src="assets/brand/logo-2fach.png" alt="2Fach"></a>
  <div class="zh-side zh-right">
    <button class="zmenu" id="menuBtn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menuOverlay"><span class="zmenu__lbl"><span class="l-open">Menu</span><span class="l-close">Close</span></span><span class="zmenu__ic" aria-hidden="true"><i></i><i></i><i></i></span></button>
  </div>
</header>

<div class="menu-ov" id="menuOverlay" aria-hidden="true">
  <nav class="menu-nav">
    <a href="Home.dc.html"><em>01</em> Home</a>
    <a href="Architecture.dc.html"><em>02</em> Architecture</a>
    <a href="Commercialization.dc.html"><em>03</em> Commercialisation</a>
    <a href="Team.dc.html"><em>04</em> Team</a>

  </nav>
  <div class="menu-foot"><span>hello@zweifach.ch &#183; Aargau, Switzerland</span><span><a href="Privacy.dc.html">Privacy</a> &#183; <a href="Terms.dc.html">Terms</a></span></div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:90},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;None&quot;,&quot;Home&quot;,&quot;Architecture&quot;,&quot;Commercialisation&quot;,&quot;Team&quot;,&quot;Contact&quot;],&quot;default&quot;:&quot;None&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;topTint&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;light&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    this._cl = [];
    this.initMenu();
    this.initSync();
    this.mark();
  }

  componentDidUpdate() { this.mark(); }

  mark() {
    const cur = String(this.props.current || '').toLowerCase();
    const ov = document.getElementById('menuOverlay');
    if (!ov) return;
    ov.querySelectorAll('.menu-nav a').forEach((a) => {
      const on = !!cur && cur !== 'none' && a.textContent.trim().toLowerCase().indexOf(cur) > -1;
      a.style.opacity = on ? '1' : '';
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
  }

  initMenu() {
    const mb = document.getElementById('menuBtn');
    const ov = document.getElementById('menuOverlay');
    const hd = document.getElementById('zhead');
    if (!mb || !ov) return;
    const setMenu = (open) => {
      ov.classList.toggle('open', open);
      ov.setAttribute('aria-hidden', open ? 'false' : 'true');
      mb.classList.toggle('is-x', open);
      mb.setAttribute('aria-expanded', open ? 'true' : 'false');
      mb.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      if (hd) {
        hd.classList.toggle('menu-open', open);
        if (open) {
          // the overlay is dark, so the bar drops its frosted white and the ink turns light
          hd.classList.remove('is-hidden');
          hd.classList.remove('is-glossy');
          hd.style.setProperty('--hc', 'var(--on-media)');
        } else if (this._resync) {
          this._resync();
        }
      }
      document.documentElement.style.overflow = open ? 'hidden' : '';
    };
    const toggle = () => setMenu(!ov.classList.contains('open'));
    mb.addEventListener('click', toggle);
    const esc = (e) => { if (e.key === 'Escape') setMenu(false); };
    document.addEventListener('keydown', esc);
    ov.querySelectorAll('a').forEach((a) => a.addEventListener('click', () => setMenu(false)));
    this._cl.push(() => document.removeEventListener('keydown', esc));
  }

  /* transparent over a dark hero (topTint="light"), frosted cream bar once scrolled */
  initSync() {
    const hdr = document.getElementById('zhead');
    if (!hdr) return;
    const tint = String(this.props.topTint || '').toLowerCase();
    let last = null;
    const sync = () => {
      const y = window.scrollY || 0;
      const atTop = y < 60;
      const glossy = !(atTop && tint === 'light');
      const light = atTop && tint === 'light';
      const key = glossy + '|' + light;
      if (key !== last) {
        last = key;
        hdr.classList.toggle('is-glossy', glossy);
        hdr.style.setProperty('--hc', light ? 'var(--on-media)' : 'var(--fg)');
      }
    };
    this._resync = () => { last = null; sync(); };
    window.addEventListener('scroll', sync, { passive: true });
    this._cl.push(() => window.removeEventListener('scroll', sync));
    sync();
    let lastY = window.scrollY || 0;
    const vis = () => {
      const y = window.scrollY || 0;
      const ov = document.getElementById('menuOverlay');
      if (!(ov && ov.classList.contains('open'))) {
        const dy = y - lastY;
        if (y < 70) hdr.classList.remove('is-hidden');
        else if (dy > 5) hdr.classList.add('is-hidden');
        else if (dy < -5) hdr.classList.remove('is-hidden');
      }
      if (Math.abs(y - lastY) > 0.5) lastY = y;
    };
    window.addEventListener('scroll', vis, { passive: true });
    this._cl.push(() => window.removeEventListener('scroll', vis));
    vis();
  }

  componentWillUnmount() { (this._cl || []).forEach((fn) => { try { fn(); } catch (e) {} }); }

  renderVals() { return {}; }
}

</script>
